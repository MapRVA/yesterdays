<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yesterdays image card example</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.0/css/all.min.css"
        integrity="sha384-sTlsophtwz/I4myskS3OIJf5VvEojkXKZyBTWZm0YD/K1pN7C5wpBPLyrsbr1SU2"
        crossorigin="anonymous">
    <link rel="stylesheet" href="ui-demo.css">
    <script src="ui-demo.js" defer></script>
</head>
<body>
    <!-- Live example: https://yesterdays.today/7134/ -->
    <main class="demo-stage demo-stage--image-card" data-demo-stage>
        <div class="image-card-wrapper">
            <article class="card h-100 shadow-sm image-card">
                <div class="position-relative">
                    <span class="badge bg-success position-absolute top-0 end-0 m-2">
                        <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                        Georeferenced
                    </span>
                    <div class="position-absolute top-0 start-0 m-2 d-flex gap-1">
                        <span class="badge bg-success">Easy</span>
                    </div>

                    <a
                        href="https://yesterdays.today/7134/"
                        target="_parent"
                        class="image-container d-block"
                        style="height: 200px; overflow: hidden; text-decoration: none; color: inherit;">
                        <img
                            src="https://cdn.yesterdays.maprva.org/images/7134/2/thumbnail.webp"
                            alt="Monumental Church in Richmond, Virginia, circa 1903"
                            class="img-fluid w-100 h-100"
                            style="object-fit: cover;">
                    </a>
                </div>

                <div class="card-body p-3">
                    <h6 class="card-title">
                        <a
                            href="https://yesterdays.today/7134/"
                            target="_parent"
                            class="text-decoration-none">
                            Monumental Church, Richmond, Va.
                        </a>
                    </h6>
                    <p class="text-muted small mb-2">
                        <i class="fas fa-calendar me-1" aria-hidden="true"></i>c1903.
                    </p>
                    <p class="card-text small text-muted">
                        1 negative : glass ; 8 x 10 in. Subjects: dry plate negatives,
                        churches, richmond, united states, virginia Locations: united
                        states, richmond, virgin…
                    </p>
                </div>

                <div class="card-footer bg-body border-top-0 p-3">
                    <div class="d-flex justify-content-end gap-2">
                        <a
                            href="https://yesterdays.today/7134/"
                            target="_parent"
                            class="btn btn-primary btn-sm">
                            <i class="fas fa-eye me-1" aria-hidden="true"></i>View
                        </a>
                    </div>
                </div>
            </article>
        </div>
    </main>
</body>
</html>
